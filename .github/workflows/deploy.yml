name: Build and Deploy Production X Miner

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the immutable image after building it
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECS_CLUSTER: bitcast
  # Existing immutable production repository and ECS task definition both use
  # this service name. The source repository name is not an ECR repository.
  ECR_REPOSITORY: bitcast-x-miner
  ECS_SERVICE: bitcast-x-miner

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Assume deploy role with GitHub OIDC
        env:
          CONFIGURED_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          role_arn="${CONFIGURED_ROLE_ARN:-arn:aws:iam::289997608167:role/bitcast-deploy}"
          oidc_token=$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r .value)
          read -r access_key secret_key session_token <<< "$(aws sts assume-role-with-web-identity \
            --role-arn "$role_arn" \
            --role-session-name "x-miner-${GITHUB_RUN_ID}" \
            --web-identity-token "$oidc_token" \
            --duration-seconds 3600 \
            --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' \
            --output text)"
          echo "::add-mask::$access_key"
          echo "::add-mask::$secret_key"
          echo "::add-mask::$session_token"
          echo "AWS_ACCESS_KEY_ID=$access_key" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$secret_key" >> "$GITHUB_ENV"
          echo "AWS_SESSION_TOKEN=$session_token" >> "$GITHUB_ENV"
      - name: Log in to Amazon ECR
        run: |
          account_id=$(aws sts get-caller-identity --query Account --output text)
          registry="${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
          echo "ECR_REGISTRY=$registry" >> "$GITHUB_ENV"
      - name: Build and push commit-pinned image
        env:
          GH_READ_ONLY: ${{ secrets.GH_READ_ONLY }}
        run: |
          docker build --secret id=github_token,env=GH_READ_ONLY \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA" .
          set +e
          push_output=$(docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA" 2>&1)
          push_status=$?
          set -e
          printf '%s\n' "$push_output"
          if [ "$push_status" -eq 0 ]; then
            exit 0
          fi
          if grep -q 'already exists.*cannot be overwritten' <<<"$push_output"; then
            echo "Commit-pinned image already exists; reusing the immutable image"
            exit 0
          fi
          exit "$push_status"

  deploy:
    needs: build
    if: ${{ inputs.deploy }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Assume deploy role with GitHub OIDC
        env:
          CONFIGURED_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          role_arn="${CONFIGURED_ROLE_ARN:-arn:aws:iam::289997608167:role/bitcast-deploy}"
          oidc_token=$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r .value)
          read -r access_key secret_key session_token <<< "$(aws sts assume-role-with-web-identity \
            --role-arn "$role_arn" \
            --role-session-name "x-miner-${GITHUB_RUN_ID}" \
            --web-identity-token "$oidc_token" \
            --duration-seconds 3600 \
            --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' \
            --output text)"
          echo "::add-mask::$access_key"
          echo "::add-mask::$secret_key"
          echo "::add-mask::$session_token"
          echo "AWS_ACCESS_KEY_ID=$access_key" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$secret_key" >> "$GITHUB_ENV"
          echo "AWS_SESSION_TOKEN=$session_token" >> "$GITHUB_ENV"
      - name: Resolve ECR registry
        run: |
          account_id=$(aws sts get-caller-identity --query Account --output text)
          echo "ECR_REGISTRY=${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com" >> "$GITHUB_ENV"
      - name: Register and deploy immutable task revision
        run: |
          aws ecs describe-task-definition --task-definition "$ECS_SERVICE" \
            --query taskDefinition --output json > task-def.json
          jq 'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)' \
            task-def.json > clean.json
          jq --arg image "$ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA" \
            '.containerDefinitions[0].image = $image' clean.json > new.json
          arn=$(aws ecs register-task-definition --cli-input-json file://new.json \
            --query taskDefinition.taskDefinitionArn --output text)
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
            --task-definition "$arn" --force-new-deployment
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"
