[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "x-miner-template"
version = "0.1.0"
description = "Minimal web miner for the Bitcast X v3 protocol"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "bitcast-x @ git+https://github.com/bitcast-network/bitcast-x.git@e70af88b0ceacc4daebfac2c89c01270b5743daa",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "uvicorn==0.52.1",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "mypy==2.3.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.1",
]

[project.scripts]
x-miner-template = "x_miner_template.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
x_miner_template = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["x_miner_template"]

[[tool.mypy.overrides]]
module = ["bittensor", "bittensor.*", "bitcast_x", "bitcast_x.*"]
ignore_missing_imports = true
